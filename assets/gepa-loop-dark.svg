<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 326" width="1200" height="326" role="img" aria-label="How GEPA works: the student model answers, every answer is checked against the expert labels with written feedback, a teacher model rewrites the prompt, and rewrites that score better are kept." font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, &#x27;Noto Sans&#x27;, Helvetica, Arial, sans-serif"><title>How GEPA works: the student model answers, every answer is checked against the expert labels with written feedback, a teacher model rewrites the prompt, and rewrites that score better are kept.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#848d97"/></marker></defs><text x="2" y="32" font-size="17" fill="#9198a1"><tspan font-weight="700" fill="#f0f6fc">Start:</tspan> the annotators’ published definition is the prompt</text><text x="1196" y="32" font-size="17" fill="#9198a1" text-anchor="end"><tspan font-weight="700" fill="#f0f6fc">Result:</tspan> a learned prompt</text><rect x="1" y="70" width="256" height="190" rx="16" fill="#151b23" stroke="#3d444d"/><circle cx="34" cy="108" r="15" fill="#1aa874"/><text x="34.0" y="114.0" font-size="16" fill="#0d1117" font-weight="700" text-anchor="middle">1</text><text x="60.0" y="115.0" font-size="20" fill="#f0f6fc" font-weight="700" text-anchor="start">Student answers</text><text x="22.0" y="158.0" font-size="17" fill="#9198a1" font-weight="400" text-anchor="start">Claude Haiku labels a few</text><text x="22.0" y="183.0" font-size="17" fill="#9198a1" font-weight="400" text-anchor="start">training passages and</text><text x="22.0" y="208.0" font-size="17" fill="#9198a1" font-weight="400" text-anchor="start">explains each answer.</text><path d="M266,165.0 L304,165.0" stroke="#848d97" stroke-width="2" marker-end="url(#ah)"/><rect x="315" y="70" width="256" height="190" rx="16" fill="#151b23" stroke="#3d444d"/><circle cx="348" cy="108" r="15" fill="#1aa874"/><text x="348.0" y="114.0" font-size="16" fill="#0d1117" font-weight="700" text-anchor="middle">2</text><text x="374.0" y="115.0" font-size="20" fill="#f0f6fc" font-weight="700" text-anchor="start">Expert check</text><text x="336.0" y="158.0" font-size="17" fill="#9198a1" font-weight="400" text-anchor="start">Every answer gets written</text><text x="336.0" y="183.0" font-size="17" fill="#9198a1" font-weight="400" text-anchor="start">feedback, such as “you</text><text x="336.0" y="208.0" font-size="17" fill="#9198a1" font-weight="400" text-anchor="start">said yes, the experts</text><text x="336.0" y="233.0" font-size="17" fill="#9198a1" font-weight="400" text-anchor="start">said no”.</text><path d="M580,165.0 L618,165.0" stroke="#848d97" stroke-width="2" marker-end="url(#ah)"/><rect x="629" y="70" width="256" height="190" rx="16" fill="#151b23" stroke="#3d444d"/><circle cx="662" cy="108" r="15" fill="#1aa874"/><text x="662.0" y="114.0" font-size="16" fill="#0d1117" font-weight="700" text-anchor="middle">3</text><text x="688.0" y="115.0" font-size="20" fill="#f0f6fc" font-weight="700" text-anchor="start">Teacher rewrites</text><text x="650.0" y="158.0" font-size="17" fill="#9198a1" font-weight="400" text-anchor="start">Claude Sonnet reads the</text><text x="650.0" y="183.0" font-size="17" fill="#9198a1" font-weight="400" text-anchor="start">mistakes and the</text><text x="650.0" y="208.0" font-size="17" fill="#9198a1" font-weight="400" text-anchor="start">student&#x27;s reasoning, then</text><text x="650.0" y="233.0" font-size="17" fill="#9198a1" font-weight="400" text-anchor="start">rewrites the prompt.</text><path d="M894,165.0 L932,165.0" stroke="#848d97" stroke-width="2" marker-end="url(#ah)"/><rect x="943" y="70" width="256" height="190" rx="16" fill="#151b23" stroke="#3d444d"/><circle cx="976" cy="108" r="15" fill="#1aa874"/><text x="976.0" y="114.0" font-size="16" fill="#0d1117" font-weight="700" text-anchor="middle">4</text><text x="1002.0" y="115.0" font-size="20" fill="#f0f6fc" font-weight="700" text-anchor="start">Keep what works</text><text x="964.0" y="158.0" font-size="17" fill="#9198a1" font-weight="400" text-anchor="start">Rewrites that help are</text><text x="964.0" y="183.0" font-size="17" fill="#9198a1" font-weight="400" text-anchor="start">scored on validation</text><text x="964.0" y="208.0" font-size="17" fill="#9198a1" font-weight="400" text-anchor="start">passages; the best stay</text><text x="964.0" y="233.0" font-size="17" fill="#9198a1" font-weight="400" text-anchor="start">in the pool.</text><path d="M1071.0,264 L1071.0,300 L129.0,300 L129.0,270" fill="none" stroke="#848d97" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="390.0" y="286" width="420" height="28" fill="#0d1117"/><text x="600.0" y="306.0" font-size="17" fill="#9198a1" font-weight="400" text-anchor="middle">repeat within a fixed budget of model calls</text></svg>
