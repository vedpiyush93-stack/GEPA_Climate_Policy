<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 338" width="1200" height="338" role="img" aria-label="Example passage from Denmark: reduce greenhouse gas emissions in 2030 by 70% and achieve a climate-neutral society by 2050. Expert labels: net zero yes, emission reduction yes, other no." font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, &#x27;Noto Sans&#x27;, Helvetica, Arial, sans-serif"><title>Example passage from Denmark: reduce greenhouse gas emissions in 2030 by 70% and achieve a climate-neutral society by 2050. Expert labels: net zero yes, emission reduction yes, other no.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker></defs><rect x="1" y="1" width="768" height="336" rx="16" fill="#f6f8fa" stroke="#d1d9e0"/><text x="32.0" y="54.0" font-size="15" fill="#6e7781" font-weight="700" text-anchor="start" letter-spacing="2">PASSAGE · DENMARK</text><text x="32.0" y="104" font-family="ui-monospace, SFMono-Regular, &#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="19" fill="#1f2328" font-weight="400" textLength="501.6" lengthAdjust="spacing">1. The purpose of this Act is for Denmark to</text><rect x="541.0" y="86" width="76.4" height="29" rx="6" fill="#0a8a5f" opacity="0.16"/><text x="545.0" y="104" font-family="ui-monospace, SFMono-Regular, &#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="19" fill="#1f2328" font-weight="600" textLength="68.4" lengthAdjust="spacing">reduce</text><rect x="28.0" y="124" width="452.6" height="29" rx="6" fill="#0a8a5f" opacity="0.16"/><text x="32.0" y="142" font-family="ui-monospace, SFMono-Regular, &#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="19" fill="#1f2328" font-weight="600" textLength="444.6" lengthAdjust="spacing">greenhouse gas emissions in 2030 by 70%</text><text x="488.0" y="142" font-family="ui-monospace, SFMono-Regular, &#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="19" fill="#1f2328" font-weight="400" textLength="239.4" lengthAdjust="spacing">compared to the level</text><text x="32.0" y="180" font-family="ui-monospace, SFMono-Regular, &#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="19" fill="#1f2328" font-weight="400" textLength="456.0" lengthAdjust="spacing">of emissions in 1990, and for Denmark to</text><rect x="495.4" y="162" width="110.6" height="29" rx="6" fill="#0a8a5f" opacity="0.16"/><text x="499.4" y="180" font-family="ui-monospace, SFMono-Regular, &#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="19" fill="#1f2328" font-weight="600" textLength="102.6" lengthAdjust="spacing">achieve a</text><rect x="28.0" y="200" width="361.4" height="29" rx="6" fill="#0a8a5f" opacity="0.16"/><text x="32.0" y="218" font-family="ui-monospace, SFMono-Regular, &#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="19" fill="#1f2328" font-weight="600" textLength="353.4" lengthAdjust="spacing">climate-neutral society by 2050</text><text x="396.8" y="218" font-family="ui-monospace, SFMono-Regular, &#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="19" fill="#1f2328" font-weight="400" textLength="296.4" lengthAdjust="spacing">at the latest, taking into</text><text x="32.0" y="256" font-family="ui-monospace, SFMono-Regular, &#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="19" fill="#1f2328" font-weight="400" textLength="649.8" lengthAdjust="spacing">account the Paris Agreement target of limiting the global</text><text x="32.0" y="294" font-family="ui-monospace, SFMono-Regular, &#x27;SF Mono&#x27;, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="19" fill="#1f2328" font-weight="400" textLength="456.0" lengthAdjust="spacing">temperature rise to 1.5 degrees Celsius.</text><path d="M784,169.0 L816,169.0" stroke="#6e7781" stroke-width="2" marker-end="url(#ah)"/><text x="834.0" y="54.0" font-size="15" fill="#6e7781" font-weight="700" text-anchor="start" letter-spacing="2">EXPERT LABELS</text><rect x="834" y="86" width="56" height="30" rx="15" fill="#0a8a5f"/><text x="862.0" y="107.0" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">yes</text><text x="906.0" y="107.0" font-size="20" fill="#1f2328" font-weight="650" text-anchor="start">Net zero target</text><text x="906.0" y="134.0" font-size="16" fill="#59636e" font-weight="400" text-anchor="start" font-style="italic">“a climate-neutral society by 2050”</text><rect x="834" y="170" width="56" height="30" rx="15" fill="#0a8a5f"/><text x="862.0" y="191.0" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">yes</text><text x="906.0" y="191.0" font-size="20" fill="#1f2328" font-weight="650" text-anchor="start">Emission reduction target</text><text x="906.0" y="218.0" font-size="16" fill="#59636e" font-weight="400" text-anchor="start" font-style="italic">“emissions in 2030 by 70%”</text><rect x="834.75" y="254.75" width="54.5" height="28.5" rx="14.25" fill="none" stroke="#8c959f" stroke-width="1.5"/><text x="862.0" y="275.0" font-size="15" fill="#59636e" font-weight="600" text-anchor="middle">no</text><text x="906.0" y="275.0" font-size="20" fill="#1f2328" font-weight="650" text-anchor="start">Other target</text></svg>
