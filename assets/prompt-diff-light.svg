<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 672" width="1200" height="672" role="img" aria-label="Line by line: each line of the annotators&#x27; rule next to the same line in GEPA&#x27;s prompt, with what GEPA kept and what it added for each label, plus a new section on what is not a target." font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, &#x27;Noto Sans&#x27;, Helvetica, Arial, sans-serif"><title>Line by line: each line of the annotators&#x27; rule next to the same line in GEPA&#x27;s prompt, with what GEPA kept and what it added for each label, plus a new section on what is not a target.</title><text x="200.0" y="26.0" font-size="14" fill="#6e7781" font-weight="700" text-anchor="start" letter-spacing="2">THE ANNOTATORS’ RULE</text><text x="576.0" y="26.0" font-size="14" fill="#0a8a5f" font-weight="700" text-anchor="start" letter-spacing="2">THE SAME LINES IN GEPA’S PROMPT</text><circle cx="7" cy="67" r="5.5" fill="#8c959f"/><text x="20.0" y="72.0" font-size="16" fill="#1f2328" font-weight="700" text-anchor="start">A target</text><rect x="184" y="44" width="344" height="95" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text x="200.0" y="72.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="400">A target is an aim to achieve a</tspan></text><text x="200.0" y="95.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="400">specific outcome, that is </tspan><tspan font-weight="700">quantifiable</tspan></text><text x="200.0" y="118.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="400">and is </tspan><tspan font-weight="700">given a deadline.</tspan></text><path d="M540,84.5 L547,91.5 L540,98.5" fill="none" stroke="#6e7781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="560" y="44" width="639" height="95" rx="12" fill="#0a8a5f" fill-opacity="0.07" stroke="#0a8a5f" stroke-opacity="0.35"/><text x="576.0" y="71.0" font-size="11" fill="#6e7781" font-weight="700" text-anchor="start" letter-spacing="1.5">KEPT</text><text x="630.0" y="72.0" font-size="15" fill="#59636e" xml:space="preserve" font-style="italic"><tspan font-weight="400">“BOTH quantifiable AND has a deadline (a target year or date)”</tspan></text><text x="576.0" y="94.0" font-size="11" fill="#0a8a5f" font-weight="700" text-anchor="start" letter-spacing="1.5">NEW</text><text x="630.0" y="95.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="400">“If either quantification or a deadline is missing, it </tspan><tspan font-weight="700">does not count.”</tspan></text><circle cx="7" cy="172" r="5.5" fill="#0a8a5f"/><text x="20.0" y="177.0" font-size="16" fill="#1f2328" font-weight="700" text-anchor="start">Net zero</text><text x="20.0" y="200.0" font-size="16" fill="#1f2328" font-weight="700" text-anchor="start">target</text><rect x="184" y="149" width="344" height="95" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text x="200.0" y="177.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="400">a commitment to </tspan><tspan font-weight="700">balance GHG emissions</tspan></text><text x="200.0" y="200.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="700">with removal, </tspan><tspan font-weight="400">effectively reducing the</tspan></text><text x="200.0" y="223.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="400">net emissions to zero.</tspan></text><path d="M540,189.5 L547,196.5 L540,203.5" fill="none" stroke="#6e7781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="560" y="149" width="639" height="95" rx="12" fill="#0a8a5f" fill-opacity="0.07" stroke="#0a8a5f" stroke-opacity="0.35"/><text x="576.0" y="176.0" font-size="11" fill="#6e7781" font-weight="700" text-anchor="start" letter-spacing="1.5">KEPT</text><text x="630.0" y="177.0" font-size="15" fill="#59636e" xml:space="preserve" font-style="italic"><tspan font-weight="400">“commitment to balance GHG emissions with removals”</tspan></text><text x="576.0" y="199.0" font-size="11" fill="#0a8a5f" font-weight="700" text-anchor="start" letter-spacing="1.5">NEW</text><text x="630.0" y="200.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="400">“an </tspan><tspan font-weight="700">explicit </tspan><tspan font-weight="400">commitment … </tspan><tspan font-weight="700">by a date”</tspan></text><text x="576.0" y="222.0" font-size="11" fill="#0a8a5f" font-weight="700" text-anchor="start" letter-spacing="1.5">NEW</text><text x="630.0" y="223.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="400">“(or </tspan><tspan font-weight="700">carbon neutrality, climate neutrality)”</tspan></text><circle cx="7" cy="277" r="5.5" fill="#0a8a5f"/><text x="20.0" y="282.0" font-size="16" fill="#1f2328" font-weight="700" text-anchor="start">Emission</text><text x="20.0" y="305.0" font-size="16" fill="#1f2328" font-weight="700" text-anchor="start">reduction</text><text x="20.0" y="328.0" font-size="16" fill="#1f2328" font-weight="700" text-anchor="start">target</text><rect x="184" y="254" width="344" height="164" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text x="200.0" y="282.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="400">a target referring to a </tspan><tspan font-weight="700">reduction in</tspan></text><text x="200.0" y="305.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="700">greenhouse gas emissions, </tspan><tspan font-weight="400">either</tspan></text><text x="200.0" y="328.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="700">economy-wide or for a sector.</tspan></text><path d="M540,329.0 L547,336.0 L540,343.0" fill="none" stroke="#6e7781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="560" y="254" width="639" height="164" rx="12" fill="#0a8a5f" fill-opacity="0.07" stroke="#0a8a5f" stroke-opacity="0.35"/><text x="576.0" y="281.0" font-size="11" fill="#6e7781" font-weight="700" text-anchor="start" letter-spacing="1.5">KEPT</text><text x="630.0" y="282.0" font-size="15" fill="#59636e" xml:space="preserve" font-style="italic"><tspan font-weight="400">“reduce greenhouse gas EMISSIONS (economy-wide or sector-specific …)”</tspan></text><text x="576.0" y="304.0" font-size="11" fill="#0a8a5f" font-weight="700" text-anchor="start" letter-spacing="1.5">NEW</text><text x="630.0" y="305.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="700">“quantified </tspan><tspan font-weight="400">… X% below baseline/BAU by year … </tspan><tspan font-weight="700">with a deadline”</tspan></text><text x="576.0" y="327.0" font-size="11" fill="#0a8a5f" font-weight="700" text-anchor="start" letter-spacing="1.5">NEW</text><text x="630.0" y="328.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="400">“Reductions in </tspan><tspan font-weight="700">energy consumption </tspan><tspan font-weight="400">… are </tspan><tspan font-weight="700">NOT </tspan><tspan font-weight="400">GHG emission reduction</tspan></text><text x="630.0" y="351.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="400">targets.”</tspan></text><text x="576.0" y="373.0" font-size="11" fill="#0a8a5f" font-weight="700" text-anchor="start" letter-spacing="1.5">NEW</text><text x="630.0" y="374.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="700">“Vague aims </tspan><tspan font-weight="400">such as &#x27;decarbonization of the sector&#x27; … </tspan><tspan font-weight="700">do not count.”</tspan></text><text x="576.0" y="396.0" font-size="11" fill="#0a8a5f" font-weight="700" text-anchor="start" letter-spacing="1.5">NEW</text><text x="630.0" y="397.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="700">“Be conservative </tspan><tspan font-weight="400">… mark reduction false.”</tspan></text><circle cx="7" cy="451" r="5.5" fill="#0a8a5f"/><text x="20.0" y="456.0" font-size="16" fill="#1f2328" font-weight="700" text-anchor="start">Other target</text><rect x="184" y="428" width="344" height="118" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text x="200.0" y="456.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="400">a target that </tspan><tspan font-weight="700">does not fit into</tspan></text><text x="200.0" y="479.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="700">reduction or net zero </tspan><tspan font-weight="400">but satisfies the</tspan></text><text x="200.0" y="502.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="400">definition of a target, e.g. </tspan><tspan font-weight="700">renewable</tspan></text><text x="200.0" y="525.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="700">energy targets.</tspan></text><path d="M540,480.0 L547,487.0 L540,494.0" fill="none" stroke="#6e7781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="560" y="428" width="639" height="118" rx="12" fill="#0a8a5f" fill-opacity="0.07" stroke="#0a8a5f" stroke-opacity="0.35"/><text x="576.0" y="455.0" font-size="11" fill="#6e7781" font-weight="700" text-anchor="start" letter-spacing="1.5">KEPT</text><text x="630.0" y="456.0" font-size="15" fill="#59636e" xml:space="preserve" font-style="italic"><tspan font-weight="400">“not net zero or GHG reduction, e.g. renewable energy share”</tspan></text><text x="576.0" y="478.0" font-size="11" fill="#0a8a5f" font-weight="700" text-anchor="start" letter-spacing="1.5">NEW</text><text x="630.0" y="479.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="400">“EV share of fleet, </tspan><tspan font-weight="700">energy efficiency/consumption reduction”</tspan></text><text x="576.0" y="501.0" font-size="11" fill="#0a8a5f" font-weight="700" text-anchor="start" letter-spacing="1.5">NEW</text><text x="630.0" y="502.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="700">“forest cover, </tspan><tspan font-weight="400">nearly-zero-energy building requirements with a date”</tspan></text><circle cx="7" cy="579" r="5.5" fill="#8c959f"/><text x="20.0" y="584.0" font-size="16" fill="#1f2328" font-weight="700" text-anchor="start">Not a target</text><rect x="184" y="556" width="344" height="72" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text x="200.0" y="584.0" font-size="15" fill="#6e7781" xml:space="preserve" font-style="italic"><tspan font-weight="400">not in the annotators’ rule</tspan></text><path d="M540,585.0 L547,592.0 L540,599.0" fill="none" stroke="#6e7781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="560" y="556" width="639" height="72" rx="12" fill="#0a8a5f" fill-opacity="0.07" stroke="#0a8a5f" stroke-opacity="0.35"/><text x="576.0" y="583.0" font-size="11" fill="#0a8a5f" font-weight="700" text-anchor="start" letter-spacing="1.5">NEW</text><text x="630.0" y="584.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="400">“project/process descriptions, activities, measures, </tspan><tspan font-weight="700">policies, studies”</tspan></text><text x="576.0" y="606.0" font-size="11" fill="#0a8a5f" font-weight="700" text-anchor="start" letter-spacing="1.5">NEW</text><text x="630.0" y="607.0" font-size="15" fill="#1f2328" xml:space="preserve"><tspan font-weight="400">“financing mechanisms, or aspirations </tspan><tspan font-weight="700">without a number and a date”</tspan></text><text x="1198" y="660" font-size="15" fill="#59636e" text-anchor="end" xml:space="preserve"><tspan font-size="11" font-weight="700" letter-spacing="1.5" fill="#6e7781">KEPT</tspan>  from the annotators’ rule      <tspan font-size="11" font-weight="700" letter-spacing="1.5" fill="#0a8a5f">NEW</tspan>  written by GEPA from the student’s mistakes</text></svg>
