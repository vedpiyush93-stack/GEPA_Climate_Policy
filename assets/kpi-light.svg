<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 156" width="1200" height="156" role="img" aria-label="Key numbers: 81% → 86% Claude Haiku, then with GEPA up in 4 of 5 folds, 1 tied; 5 / 5 folds where Haiku + GEPA beats Claude Sonnet (81%); 75-87 labelled passages per fold classical ML used 1,878-2,200; +27 / −6 passages fixed / broken on 300 held-out passages" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, &#x27;Noto Sans&#x27;, Helvetica, Arial, sans-serif"><title>Key numbers: 81% → 86% Claude Haiku, then with GEPA up in 4 of 5 folds, 1 tied; 5 / 5 folds where Haiku + GEPA beats Claude Sonnet (81%); 75-87 labelled passages per fold classical ML used 1,878-2,200; +27 / −6 passages fixed / broken on 300 held-out passages</title><rect x="1" y="1" width="280" height="154" rx="14" fill="#f6f8fa" stroke="#0a8a5f" stroke-width="1.5"/><text x="24.0" y="64.0" font-size="38" fill="#0a8a5f" font-weight="750" text-anchor="start">81% → 86%</text><text x="24.0" y="102.0" font-size="17" fill="#1f2328" font-weight="600" text-anchor="start">Claude Haiku, then with GEPA</text><text x="24.0" y="127.0" font-size="16" fill="#59636e" font-weight="400" text-anchor="start">up in 4 of 5 folds, 1 tied</text><rect x="307" y="1" width="280" height="154" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="330.0" y="64.0" font-size="38" fill="#1f2328" font-weight="750" text-anchor="start">5 / 5</text><text x="330.0" y="102.0" font-size="17" fill="#1f2328" font-weight="600" text-anchor="start">folds where Haiku + GEPA</text><text x="330.0" y="127.0" font-size="16" fill="#59636e" font-weight="400" text-anchor="start">beats Claude Sonnet (81%)</text><rect x="613" y="1" width="280" height="154" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="636.0" y="64.0" font-size="38" fill="#1f2328" font-weight="750" text-anchor="start">75-87</text><text x="636.0" y="102.0" font-size="17" fill="#1f2328" font-weight="600" text-anchor="start">labelled passages per fold</text><text x="636.0" y="127.0" font-size="16" fill="#59636e" font-weight="400" text-anchor="start">classical ML used 1,878-2,200</text><rect x="919" y="1" width="280" height="154" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="942.0" y="64.0" font-size="38" fill="#1f2328" font-weight="750" text-anchor="start">+27 / −6</text><text x="942.0" y="102.0" font-size="17" fill="#1f2328" font-weight="600" text-anchor="start">passages fixed / broken</text><text x="942.0" y="127.0" font-size="16" fill="#59636e" font-weight="400" text-anchor="start">on 300 held-out passages</text></svg>
