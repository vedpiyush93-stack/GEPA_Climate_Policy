<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 156" width="1200" height="156" role="img" aria-label="Key numbers: 81% → 86% Claude Haiku, then with GEPA up in 4 of 5 folds, 1 tied; 5 / 5 folds where Haiku + GEPA beats Claude Sonnet (81%); 75-87 labelled passages per fold classical ML used 1,878-2,200; +55 / −13 passages fixed / broken on 750 test passages, 5 folds" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, &#x27;Noto Sans&#x27;, Helvetica, Arial, sans-serif"><title>Key numbers: 81% → 86% Claude Haiku, then with GEPA up in 4 of 5 folds, 1 tied; 5 / 5 folds where Haiku + GEPA beats Claude Sonnet (81%); 75-87 labelled passages per fold classical ML used 1,878-2,200; +55 / −13 passages fixed / broken on 750 test passages, 5 folds</title><rect x="1" y="1" width="280" height="154" rx="14" fill="#151b23" stroke="#1aa874" stroke-width="1.5"/><text x="24.0" y="64.0" font-size="38" fill="#1aa874" font-weight="750" text-anchor="start">81% → 86%</text><text x="24.0" y="102.0" font-size="17" fill="#f0f6fc" font-weight="600" text-anchor="start">Claude Haiku, then with GEPA</text><text x="24.0" y="127.0" font-size="16" fill="#9198a1" font-weight="400" text-anchor="start">up in 4 of 5 folds, 1 tied</text><rect x="307" y="1" width="280" height="154" rx="14" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="330.0" y="64.0" font-size="38" fill="#f0f6fc" font-weight="750" text-anchor="start">5 / 5</text><text x="330.0" y="102.0" font-size="17" fill="#f0f6fc" font-weight="600" text-anchor="start">folds where Haiku + GEPA</text><text x="330.0" y="127.0" font-size="16" fill="#9198a1" font-weight="400" text-anchor="start">beats Claude Sonnet (81%)</text><rect x="613" y="1" width="280" height="154" rx="14" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="636.0" y="64.0" font-size="38" fill="#f0f6fc" font-weight="750" text-anchor="start">75-87</text><text x="636.0" y="102.0" font-size="17" fill="#f0f6fc" font-weight="600" text-anchor=