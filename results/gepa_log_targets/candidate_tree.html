<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.9167, "parents": "seed", "role": "Seed", "components": {"classify.predict": "Identify the climate targets in a passage from a national law, policy or UNFCCC submission.\n\nA target is an aim to achieve a specific outcome, that is quantifiable and is given a deadline.\nTarget types:\n- net_zero: a commitment to balance GHG emissions with removal, effectively reducing the net emissions to zero.\n- reduction: a target referring to a reduction in greenhouse gas emissions, either economy-wide or for a sector.\n- other: a target that does not fit into reduction or net zero but satisfies the definition of a target, e.g. renewable energy targets.\nA passage can contain several target types, or none."}},
{"idx": 1, "score": 0.9611, "parents": "0", "role": "Best", "components": {"classify.predict": "Identify the climate targets in a passage from a national law, policy or UNFCCC submission (passages are often noisy text fragments, e.g. extracted from PDFs, with table remnants, page numbers, or partial sentences).\n\nOutput: brief reasoning, then three boolean flags: net_zero, reduction, other. A passage can have several true flags, or none.\n\nDefinition: A target is an aim to achieve a specific outcome that is BOTH quantifiable AND has a deadline (a target year or date). Expert annotators apply this strictly. If either quantification or a deadline is missing, it does not count.\n\nTarget types:\n- net_zero: an explicit commitment to balance GHG emissions with removals / reach net zero (or carbon neutrality, climate neutrality) by a date. \n- reduction: a quantified target to reduce greenhouse gas EMISSIONS (economy-wide or sector-specific, e.g. X% below baseline/BAU by year, or 'halve emissions by 2030') with a deadline. Reductions in energy consumption, trips, waste, etc. are NOT GHG emission reduction targets. Vague aims such as 'decarbonization of the sector' without a quantified figure do not count. Be conservative: if the emissions-reduction statement is vague, loosely worded, ambiguous in scope, or its quantity/deadline cannot be clearly tied to it in a fragmentary passage, mark reduction false.\n- other: a quantifiable, dated target that is not net zero or GHG reduction, e.g. renewable energy share (20% by 2020, 30% by 2030), EV share of fleet, energy efficiency/consumption reduction, forest cover, nearly-zero-energy building requirements with a date, etc.\n\nWhat is NOT a target: project/process descriptions, activities, measures, policies, studies, institutional development, financing mechanisms, or aspirations without a number and a date. Return all flags false for such passages.\n\nStrategy: 1) Scan for explicit net-zero/neutrality commitments with a date. 2) Scan for quantified GHG emission reductions with a date; check that the thing being reduced is really GHG emissions (not energy use or other metrics) and that it is stated clearly with a number. 3) Scan for other quantified, dated goals. 4) For each candidate, verify both quantity and deadline; discard otherwise. Set flags independently. Do not mark reduction merely because the passage mentions 'decarbonization', 'halve emissions' loosely, or energy savings; in the worked example (Andorra-style mobility/building passage with EV shares of 20%/30% by 2030, 50%/70% by 2050, 15% energy consumption reduction, 'Halve emissions' and 'Decarbonization' of transport), experts labeled net_zero=no, reduction=no, other=yes."}},
{"idx": 2, "score": 0.9611, "parents": "1", "role": "Pareto Front", "components": {"classify.predict": "Identify the climate targets in a passage from a national law, policy or UNFCCC submission (passages are often noisy text fragments, e.g. extracted from PDFs, with table remnants, page numbers, headings, or partial sentences; they may be in translated text from any country).\n\nOutput: brief reasoning, then three boolean flags: net_zero, reduction, other. A passage can have several true flags, or none.\n\nDefinition: A target is an aim to achieve a specific outcome that is BOTH quantifiable AND has a deadline (a target year or date). Expert annotators apply this strictly for reduction and other targets. If either quantification or a deadline is missing, it generally does not count. EXCEPTION for net zero: a stated goal of neutrality/net zero by a year is inherently quantified (zero balance), so it counts when a year is given.\n\nTarget types:\n- net_zero: a commitment to reach net zero GHG / carbon neutrality / climate neutrality / CO2-neutral / climate-neutral status by a date. IMPORTANT: Experts label this YES whenever the passage states a neutrality/net-zero goal with a year, even if it is framed as a policy ambition, is sector-specific (e.g. 'CO2-neutral low-temperature heating in 2050', 'climate-neutral building stock by 2050', 'carbon-neutral transport by 2040'), or does not explicitly mention removals/offsets. Do NOT reject it just because it is sectoral, described as a policy pillar/objective, or lacks the words 'emissions and removals balance'. Example: a Netherlands passage on built-environment heating saying the policy aims at 'CO2 neutral low-temperature heating in 2050' was labeled net_zero=yes, reduction=no (vague 'far-reaching/significant/greatly reduce' gas use with no figures), other=no. Still require a year: 'aim to become climate neutral' with no date is false.\n- reduction: a quantified target to reduce greenhouse gas EMISSIONS (economy-wide or sector-specific, e.g. X% below baseline/BAU by year, or 'halve emissions by 2030') with a deadline. Reductions in energy consumption, gas use, heat demand, trips, waste, etc. are NOT GHG emission reduction targets. Vague aims such as 'decarbonization of the sector', 'significant/far-reaching reduction' without a quantified figure do not count. Be conservative: if the emissions-reduction statement is vague, loosely worded, ambiguous in scope, or its quantity/deadline cannot be clearly tied to it in a fragmentary passage, mark reduction false.\n- other: a quantifiable, dated target that is not net zero or GHG reduction, e.g. renewable energy share (20% by 2020, 30% by 2030), EV share of fleet, energy efficiency/consumption reduction, forest cover, nearly-zero-energy building requirements with a date, etc.\n\nWhat is NOT a target: project/process descriptions, activities, measures, policies, studies, institutional development, financing mechanisms, eligibility criteria, inventory/methodology discussions (e.g. landfill activity data, FOD method, uncertainty notes), or aspirations without a number/date (other than the neutrality-with-year case above). Return all flags false for such passages. Typical all-false passages: GHG inventory methodology text, heritage/funding eligibility conditions, lists of measures with no figures or dates.\n\nStrategy: 1) Scan for any neutrality/net-zero/CO2-neutral/climate-neutral goal with a year (including sectoral ones) -> net_zero true. 2) Scan for quantified GHG emission reductions with a date; check that the thing being reduced is really GHG emissions (not energy use or other metrics) and that it is stated clearly with a number. 3) Scan for other quantified, dated goals. 4) For each candidate, verify the deadline and (for reduction/other) the quantity; discard otherwise. Set flags independently. Do not mark reduction merely because the passage mentions 'decarbonization', 'halve emissions' loosely, or energy/gas savings; in the worked example (Andorra-style mobility/building passage with EV shares of 20%/30% by 2030, 50%/70% by 2050, 15% energy consumption reduction, 'Halve emissions' and 'Decarbonization' of transport), experts labeled net_zero=no, reduction=no, other=yes."}},
{"idx": 3, "score": 0.9556, "parents": "1", "role": "", "components": {"classify.predict": "Identify the climate targets in a passage from a national law, policy or UNFCCC submission. Passages are often noisy text fragments (extracted from PDFs, with table remnants, page numbers, partial sentences).\n\nOutput: brief reasoning, then three boolean flags: net_zero, reduction, other. A passage can have several true flags, or none.\n\nCore definition: A target is an aim to achieve a specific outcome that is BOTH quantifiable AND has a deadline (target year/date). Expert annotators apply this strictly. If either quantification or a deadline is missing, it does not count.\n\nTarget types:\n- net_zero: an explicit commitment to reach net zero GHG emissions / balance emissions with removals / carbon or climate neutrality BY A DATE, stated as the country's own commitment or target (e.g. 'reduce GHG emissions to net zero by 2050 at the latest'). A passing, contextual or aspirational mention does NOT count. For example, 'transformation of the economy towards climate neutrality' or 'move decisively towards carbon neutrality in the 2050 horizon' inside a descriptive/background paragraph (Andorra circular economy law passage) was labeled net_zero=NO by experts. Only mark net_zero when the passage itself clearly states a binding/explicit goal of net zero with a deadline (e.g. the Swiss Glacier Initiative: net zero by 2050 at the latest = yes).\n- reduction: a quantified target to reduce greenhouse gas EMISSIONS (economy-wide or sector-specific; e.g. X% below baseline/BAU by year, or 'halve emissions by 2030') with a deadline. Reductions in energy consumption, trips, waste, etc. are NOT GHG reduction targets. Vague aims such as 'decarbonization' or 'objectives set for reduction of GHG emissions' without a figure do not count. A 'linear reduction pathway' or 'interim goals' without numbers does not count. Be conservative: if the statement is vague, loosely worded, ambiguous in scope, or its quantity/deadline cannot clearly be tied to it in a fragmentary passage, mark reduction false.\n- other: any quantifiable, dated target that is not net zero or GHG reduction, e.g. renewable energy share (20% by 2020, 30% by 2030), EV share of fleet, energy efficiency/consumption reduction, forest cover (e.g. 'increasing forest cover to reach 20% by 2035' = other yes), nearly-zero-energy building requirements with a date, and also dated phase-outs/bans that are concrete, e.g. no fossil heating and motor fuels can be sold from 2050 (in the Swiss Glacier Initiative passage experts labeled other=YES, likely because of this dated, concrete sales ban alongside net zero by 2050). Treat clear dated bans/phase-outs/mandated end-states as 'other' targets, since they are specific outcomes with a deadline, even without a percentage.\n\nWhat is NOT a target: project/process descriptions, activities, general measures, policies, studies, institutional development, financing mechanisms, survey results (e.g. '90% of the population approves a ban'), background statements, or aspirations without both a number/specific outcome and a date. Return all flags false for such passages.\n\nStrategy: 1) Scan for explicit net-zero/neutrality commitments with a date; check they are real commitments and not background context. 2) Scan for quantified GHG emission reductions with a date; verify the thing reduced is GHG emissions and a number is given. 3) Scan for other quantified/specific dated goals (shares, forest cover, efficiency, bans/phase-outs with a date). 4) For each candidate verify both specific outcome and deadline; discard otherwise. Set flags independently; net_zero and other can both be true. Do not mark reduction merely because the passage mentions 'decarbonization', loose 'halve emissions', or energy savings; in the worked example (Andorra-style mobility/building passage with EV shares of 20%/30% by 2030, 50%/70% by 2050, 15% energy consumption reduction, 'Halve emissions' and 'Decarbonization' of transport), experts labeled net_zero=no, reduction=no, other=yes. Survey statistics and circular-economy descriptions with only a vague 2050 neutrality mention and no real targets: all false."}},
{"idx": 4, "score": 0.9556, "parents": "2", "role": "Pareto Front", "components": {"classify.predict": "Identify the climate targets in a passage from a national law, policy or UNFCCC submission (passages are often noisy text fragments, e.g. extracted from PDFs, with table remnants, page numbers, headings, or partial sentences; they may be translated text from any country).\n\nOutput: brief reasoning, then three boolean flags: net_zero, reduction, other. A passage can have several true flags, or none.\n\nDefinition: A target is an aim to achieve a specific outcome that is BOTH quantifiable AND has a deadline (a target year or date). Expert annotators apply this strictly for reduction and other targets. If either quantification or a deadline is missing, it generally does not count. EXCEPTION for net zero: a stated goal of neutrality/net zero by a year is inherently quantified (zero balance), so it counts when a year is given.\n\nTarget types:\n- net_zero: a commitment to reach net zero GHG / carbon neutrality / climate neutrality / CO2-neutral / climate-neutral status by a date. Experts label this YES whenever the passage states a neutrality/net-zero goal with a year, even if framed as a policy ambition, sector-specific (e.g. 'CO2-neutral low-temperature heating in 2050', 'climate-neutral building stock by 2050', 'carbon-neutral transport by 2040'), or without explicit mention of removals/offsets. Do NOT reject it because it is sectoral or described as a policy pillar/objective. Example: a Netherlands passage on built-environment heating aiming at 'CO2 neutral low-temperature heating in 2050' was net_zero=yes, reduction=no (vague 'far-reaching/significant/greatly reduce' gas use without figures), other=no. Still require a year: 'aim to become climate neutral' with no date is false.\n- reduction: a quantified target to reduce greenhouse gas EMISSIONS (economy-wide or sector-specific, e.g. X% below baseline/BAU by year, or 'halve emissions by 2030') with a deadline. Reductions in energy consumption, gas use, heat demand, trips, waste, etc. are NOT GHG emission reduction targets. Vague aims ('decarbonization of the sector', 'significant/far-reaching reduction') without a figure do not count. Be conservative: if the emissions-reduction statement is vague, loosely worded, ambiguous in scope, or its quantity/deadline cannot be clearly tied to it in a fragmentary passage, mark reduction false.\n- other: a quantifiable, dated target that is not net zero or GHG reduction, e.g. renewable energy share or capacity (20% by 2020, 30% by 2030; 7.8% of installed capacity by 2020), EV share of fleet, energy efficiency/consumption reduction target, forest cover, nearly-zero-energy building requirements with a date, etc. The target must be presented as something the plan/government/country AIMS or COMMITS to achieve (e.g. 'is targeted to reach', 'will', 'shall').\n\nWhat is NOT a target: project/process descriptions, activities, measures, policies, studies, institutional development, financing mechanisms, eligibility criteria, inventory/methodology discussions (e.g. landfill activity data, FOD method, uncertainty notes), historical statistics, growth projections/forecasts, estimated potentials (e.g. 'potential of reducing consumption of old buildings is 30-50%'), and aspirations without a number/date (other than the neutrality-with-year case). Return all flags false for such passages. Typical all-false passages: GHG inventory methodology text, heritage/funding eligibility conditions, lists of measures with no figures or dates, descriptive background/situation analysis.\n\nIMPORTANT caution on background/descriptive passages: a passage that merely describes the current situation (sector shares of energy use, housing stock age, heating coverage) and only incidentally mentions a national target (e.g. 'The construction sector is responsible for achieving energy savings of approximately 10-12% in the national target of 20% by 2020') was labeled by experts as other=NO, reduction=NO, net_zero=NO (Moldova building-sector example). Incidental or second-hand references to a target inside a descriptive/diagnostic passage, where the passage itself is not setting the target, should not be counted; be strict. Only mark 'other' when the passage clearly states the dated quantified goal as the aim being set (e.g. the Malaysia passage: renewable capacity 'targeted to reach 7.8% of total installed capacity by 2020' = other yes). When in doubt about whether a dated figure is a real target versus a projection, estimate, or passing reference, mark false.\n\nStrategy: 1) Scan for any neutrality/net-zero/CO2-neutral/climate-neutral goal with a year (including sectoral ones) -> net_zero true. 2) Scan for quantified GHG emission reductions with a date; check that the thing reduced is really GHG emissions (not energy use) and stated clearly with a number. 3) Scan for other quantified, dated goals that the document itself sets. 4) For each candidate, verify the deadline and (for reduction/other) the quantity, and that it is a genuine target not a projection, potential, historical figure or incidental mention; discard otherwise. Set flags independently. Do not mark reduction merely because the passage mentions 'decarbonization', 'halve emissions' loosely, or energy/gas savings. Worked example: an Andorra-style mobility/building passage with EV shares of 20%/30% by 2030, 50%/70% by 2050, 15% energy consumption reduction, 'Halve emissions' and 'Decarbonization' of transport was labeled net_zero=no, reduction=no, other=yes. A fragment with only historical growth rates and a growth projection (e.g. 1.2% yearly 2005-2009, 7% growth) is all false."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.92)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.96)", fillcolor=cyan, tooltip=" "];
    2 [label="2\\n(0.96)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(0.96)", fillcolor=lightgray, tooltip=" "];
    4 [label="4\\n(0.96)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    1 -> 2;
    1 -> 3;
    2 -> 4;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
