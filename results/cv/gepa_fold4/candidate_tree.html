<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.9333, "parents": "seed", "role": "Seed", "components": {"classify.predict": "Identify the climate targets in a passage from a national law, policy or UNFCCC submission.\n\nA target is an aim to achieve a specific outcome, that is quantifiable and is given a deadline.\nTarget types:\n- net_zero: a commitment to balance GHG emissions with removal, effectively reducing the net emissions to zero.\n- reduction: a target referring to a reduction in greenhouse gas emissions, either economy-wide or for a sector.\n- other: a target that does not fit into reduction or net zero but satisfies the definition of a target, e.g. renewable energy targets.\nA passage can contain several target types, or none."}},
{"idx": 1, "score": 0.9111, "parents": "0", "role": "", "components": {"classify.predict": "Identify the climate targets in a passage from a national law, policy or UNFCCC submission (the passage may be an excerpt, possibly with stray figure/table references). Output brief reasoning and three boolean flags: net_zero, reduction, other.\n\nDefinition: A target is an aim to achieve a specific outcome that is BOTH quantifiable AND given a deadline/timeframe (a target year, or a defined future policy period) AND is a forward-looking commitment or goal of the document itself. Only flag a type if the passage contains such a target.\n\nTarget types:\n- net_zero: a commitment to balance GHG emissions with removal, effectively reducing net emissions to zero (e.g., carbon neutrality / net zero by a year).\n- reduction: a target to reduce greenhouse gas emissions, economy-wide or for a sector (e.g., X% below baseline/BAU by year; emissions intensity reductions).\n- other: a target that is not a reduction or net zero but still satisfies the definition (quantified + deadline), and is climate-relevant, e.g., renewable energy share by a year, energy efficiency targets, specific mitigation/adaptation goals with numbers and dates.\nA passage can contain several target types, or none (all false).\n\nGuidance learned from expert labels:\n- Be conservative. Most passages have no target. Descriptive text, background, statistics, inventories/emissions breakdowns, awareness/communication/education strategies, institutional descriptions, and lists of constraints or challenges are NOT targets -> all false.\n- Do not flag 'other' for historic or past-policy goals, review/evaluation of earlier policy performance (e.g., a previous policy's 30% forest cover or 75% community-managed forest goals, with a recommendation to keep pursuing them), or vague recommendations to continue pursuing objectives. The experts labelled such a passage as no target, since there was no clearly stated new quantified target with a deadline of the document itself.\n- Vague aims without numbers (e.g., 'increase awareness', 'enhance resilience') are not targets. Numbers without a deadline are not targets. Percentages describing current/past shares are not targets.\n- If unsure whether a quantified aim is a real, current, deadline-bound commitment, lean to false.\n- Decide each type independently; set net_zero/reduction true only for emissions-related targets, and use other only for non-emissions quantified, deadline-bound targets that are clearly current commitments."}},
{"idx": 2, "score": 0.9278, "parents": "1", "role": "Pareto Front", "components": {"classify.predict": "Identify the climate targets in a passage from a national law, policy or UNFCCC submission (NDC, national communication, energy policy, mitigation project sheet, etc.). The passage may be an excerpt, possibly truncated, with stray figure/table references, page numbers, annex headings or garbled table text. Output brief reasoning and three boolean flags: net_zero, reduction, other.\n\nDefinition: A target is an aim to achieve a specific outcome that is BOTH quantifiable AND given a deadline/timeframe (a target year, or a defined future policy period) AND is a forward-looking commitment or goal of the document itself. Only flag a type if the passage contains such a target.\n\nTarget types:\n- net_zero: a commitment to balance GHG emissions with removal, effectively reducing net emissions to zero (e.g., carbon neutrality / net zero / climate neutral by a year). A policy declaration to drive the country toward a carbon neutral economy by 2050 counts (the target is the neutrality + year; no percentage is needed). Net zero does not automatically imply reduction=true; flag reduction only if a separate reduction target (e.g., X% below baseline) is stated.\n- reduction: a target to reduce greenhouse gas emissions, economy-wide or for a sector (e.g., X% below baseline/BAU by year; emissions intensity reductions; absolute reduction by a year). It must be a stated national/sector-level commitment, not a by-product estimate.\n- other: a target that is not a reduction or net zero but still satisfies the definition (quantified + deadline), and is climate-relevant, e.g., installed renewable capacity or renewable share by a year, energy efficiency targets, access targets, forest cover, specific mitigation/adaptation goals with numbers and dates.\nA passage can contain several target types, or none (all false).\n\nGuidance learned from expert labels:\n- Be conservative. Most passages have no target. Descriptive text, background, statistics, inventories/emissions breakdowns, awareness/communication/education strategies, institutional descriptions, and lists of constraints or challenges are NOT targets -> all false.\n- Fragments that merely describe the type of target without stating numbers or years (e.g., 'EU NDC is an absolute, economy-wide reduction in GHG emissions', 'Not applicable', annex headings) -> all false.\n- Project-level mitigation sheets (e.g., a solar plant programme of 150 MWp/year 2021-2030, 1500 MW total): the capacity build-out with dates is 'other'. Expected/avoided emissions of the project (e.g., 'will prevent ~216,625 tCO2 per year', indicator tables of emissions avoided, jobs created) are impact estimates/co-benefits, NOT an emissions reduction target -> reduction=false (experts labelled this reduction=no). Reserve reduction=true for explicit emissions reduction goals (percent/absolute vs baseline/BAU by a year), not projected project savings.\n- Context figures from a wider national strategy (e.g., 'national strategy aims for 52% renewables by 2030') cited as background do not by themselves need to drive flags if the passage's own commitment is something else; still, a clearly stated quantified, dated renewable goal can count as 'other'.\n- Do not flag 'other' for historic or past-policy goals, review/evaluation of earlier policy performance (e.g., a previous policy's 30% forest cover or 75% community-managed forest goals, with a recommendation to keep pursuing them). The experts labelled such a passage as no target, since there was no clearly stated new quantified target with a deadline of the document itself.\n- Vague aims without numbers (e.g., 'increase awareness', 'enhance resilience', 'attract private capital', 'ensure access to affordable energy') are not targets. Numbers without a deadline are not targets. Percentages describing current/past shares are not targets.\n- If unsure whether a quantified aim is a real, current, deadline-bound commitment, lean to false.\n- Decide each type independently; set net_zero/reduction true only for emissions-related targets, and use other only for non-emissions quantified, deadline-bound targets that are clearly current commitments.\n\nOutput format: short reasoning (identify the quoted target, its number and deadline, or note why none exists), then net_zero, reduction, other as booleans."}},
{"idx": 3, "score": 0.9389, "parents": "2", "role": "Best", "components": {"classify.predict": "Identify the climate targets in a passage from a national law, policy or UNFCCC submission (NDC, national communication, energy/transport/waste/forest policy, mitigation project sheet, etc.). The passage may be an excerpt, possibly truncated, with stray figure/table references, page numbers, annex headings or garbled text. Output brief reasoning and three boolean flags: net_zero, reduction, other.\n\nDefinition: A target is an aim to achieve a specific outcome that is BOTH quantifiable AND given a deadline/timeframe (a target year, or a defined future/policy period such as 'over the next five years') AND is a forward-looking commitment or goal stated by the document itself. Only flag a type if the passage contains such a target.\n\nTarget types:\n- net_zero: a commitment to balance GHG emissions with removals (carbon neutrality / net zero / climate neutral by a year). A declaration to drive the country toward a carbon neutral economy by 2050 counts (neutrality + year; no percentage needed). Net zero does not imply reduction=true; flag reduction only if a separate reduction target (e.g., X% below baseline) is stated.\n- reduction: a target to reduce greenhouse gas emissions, economy-wide or sectoral (X% below baseline/BAU by year; emissions intensity reductions; absolute reductions by a year). It must be a stated national/sector-level emissions commitment, not a by-product estimate.\n- other: a target that is not net zero/emissions reduction but is quantified + dated, e.g., installed renewable capacity or renewable share by a year, energy efficiency targets, access targets, forest cover, waste reduction/recycling rates, infrastructure/transport build-out or modal goals, specific mitigation/adaptation goals with numbers and dates. Be reasonably inclusive about what counts as 'other' when the passage is from a climate/environment/energy/transport/waste policy document: the experts judged quantified, dated environmental-sector targets as 'other' even when the link to GHG emissions is indirect.\n\nA passage can contain several target types, or none (all false). Decide each type independently.\n\nGuidance learned from expert labels:\n- IMPORTANT lessons from corrections: (1) A waste-policy article with dated quantified goals (e.g., 15% reduction of waste going to incineration/storage by 2012; 7% per-inhabitant household waste cut over five years; recycling rates of 35% in 2012 and 45% in 2015; 75% for packaging waste) was labelled other=yes, reduction=no, net_zero=no. Do NOT dismiss a target merely because its deadline year is in the past relative to today; if the document itself sets it as its own current commitment, count it. Do not require explicit GHG linkage for 'other'. (2) A transport policy passage stating 'The Core [trans-European transport] Network is to be completed by 2030 while the Comprehensive Network is to be completed by 2050' was labelled other=yes: a dated infrastructure completion goal in a sustainable-transport/climate-relevant document counts as an 'other' target, even without a numeric percentage. So dated completion/delivery goals of climate-relevant programmes count; do not reject them for lacking emissions numbers.\n- Still be conservative with purely descriptive material. Descriptive text, background, statistics, inventories/emissions breakdowns, awareness/communication/education strategies, institutional descriptions, species/habitat descriptions, and lists of constraints or challenges are NOT targets -> all false (e.g., a garbled fragment about bird species counts and wildlife pressure at a national park = all false; numbers like '380 bird species' are descriptive).\n- Fragments that only describe the type of target without numbers or years (e.g., 'EU NDC is an absolute, economy-wide reduction in GHG emissions', 'Not applicable', annex headings) -> all false.\n- Project-level mitigation sheets (e.g., solar plant programme of 150 MWp/year 2021-2030, 1500 MW total): the capacity build-out with dates is 'other'. Expected/avoided emissions of the project ('will prevent ~216,625 tCO2 per year', indicator tables, jobs created) are impact estimates, NOT a reduction target -> reduction=false. Reserve reduction=true for explicit emissions reduction goals vs baseline/BAU by a year.\n- Context figures from a wider national strategy cited as background don't by themselves drive flags if the passage's own commitment is something else; a clearly stated quantified, dated renewable goal can still count as 'other'.\n- Do not flag 'other' for historic/past-policy goals that are only being reviewed or evaluated (e.g., a previous policy's 30% forest cover or 75% community-managed forest goals, with a recommendation to keep pursuing them) -> no target. Distinguish this from a policy article that itself sets goals with past-relative-to-today years: the latter is the document's own commitment (count it); the former is retrospective review.\n- Vague aims without numbers or dates ('increase awareness', 'enhance resilience', 'attract private capital', 'ensure access to affordable energy', 'strengthen waste policy') are not targets. Numbers without a deadline are not targets. Percentages describing current/past shares or baselines (e.g., '24% in 2004') are not targets by themselves.\n- When the passage clearly states a quantified or dated goal the document itself sets, in a climate/energy/transport/waste/environment policy context, lean to flagging 'other'; if it is truly unclear whether it is a current commitment versus background/review, lean to false.\n- Set net_zero/reduction true only for emissions-related targets (waste, recycling or infrastructure targets are 'other', not 'reduction').\n\nOutput format: short reasoning (quote the target, its number and deadline, and explain the type chosen; or note why none exists), then net_zero, reduction, other as booleans."}},
{"idx": 4, "score": 0.9167, "parents": "1", "role": "Pareto Front", "components": {"classify.predict": "Identify the climate targets in a passage from a national law, policy, or UNFCCC submission (NDC, national communication, biennial report, strategy, etc.). The passage may be an excerpt with stray fragments, headings, or figure/table references; ignore those. Output brief reasoning and three boolean flags: net_zero, reduction, other.\n\nDefinition: A target is an aim to achieve a specific outcome that is BOTH quantifiable AND given a deadline/timeframe (a target year, or a defined future policy period) AND is a forward-looking commitment or goal of the document itself. Only flag a type if the passage contains such a target.\n\nTarget types:\n- net_zero: a commitment to balance GHG emissions with removals, i.e., net-zero emissions / carbon neutrality / climate neutrality by a year.\n- reduction: a target to reduce GHG emissions, economy-wide or for a sector (e.g., X% below baseline/BAU/base-year by a year; emissions intensity reductions; absolute emissions caps/peaks with a year).\n- other: a climate-relevant target that is not a reduction or net zero but still is quantified + deadline-bound and a current commitment, e.g., renewable energy share by a year (like 20% renewables by 2030), energy efficiency targets, forest cover/afforestation targets, specific mitigation or adaptation goals with numbers and dates.\nA passage can contain several target types, or none (all false). Decide each type independently. Set net_zero/reduction true only for emissions-related targets; use other only for non-emissions quantified, deadline-bound targets that are clearly current commitments.\n\nGuidance learned from expert labels:\n- Be conservative. Most passages have no target. Descriptive text, background, statistics, inventories/emission breakdowns, scenario descriptions, projections, awareness/communication/education strategies, institutional descriptions, and lists of constraints or challenges are NOT targets -> all false.\n- Scenario/projection language is NOT a target. E.g., a with-measures vs. with-additional-measures (WAM/WEM) scenario saying consumption or energy intensity will decline by 2030 is a modelled outcome, not a commitment -> all false. Likewise, modelling assumptions or measure descriptions inside a mitigation scenario (e.g., 'the amount of LPG and coal replaced by solar thermal and biomass amounts to 10% at the end of the planning period', in a WAM/Industry measure description) are projection assumptions, not stated targets; experts labelled this no target. Do not flag 'other' for such measure-assumption percentages, even if they have an end-of-period date.\n- Dates that only describe when something becomes available (e.g., infrastructure available after 2020) are conditions, not targets.\n- Do not flag 'other' for historic or past-policy goals, reviews/evaluations of earlier policy performance (e.g., a previous policy's 30% forest cover goal with a recommendation to keep pursuing it), or vague recommendations to continue pursuing objectives.\n- Vague aims without numbers (e.g., 'increase awareness', 'enhance resilience', 'reduce carbon footprint') are not targets. Numbers without a deadline are not targets. Percentages describing current/past shares are not targets.\n- Positive example: a policy goal stating 'increase the percentage of renewables in the energy mix with targets of 11% by 2012, 12.5% by 2015 and 20% by 2030' -> other=true (explicit targets with years, still current via the 2030 value), while net_zero and reduction stay false because the carbon-footprint statements are qualitative.\n- Explicit, stated targets (using words like 'target', 'goal', 'will reduce/achieve ... by [year]', 'commit') in the document's own voice count; modelled scenario outputs and assumptions do not.\n- If unsure whether a quantified aim is a real, current, deadline-bound commitment, lean to false.\n\nOutput format: short reasoning (identify any candidate targets, check quantified + deadline + forward-looking commitment, classify type), then net_zero, reduction, other booleans."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.93)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.91)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(0.93)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(0.94)", fillcolor=cyan, tooltip=" "];
    4 [label="4\\n(0.92)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    1 -> 2;
    2 -> 3;
    1 -> 4;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
